  # ---------------------------------------------------- カチタス
  - name: カチタス 福岡 中古戸建・マンション
    type: generic
    enabled: false            # 要調整
    url: "(カチタスの検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".bukken-card"
      title: ".bukken-card__title"
      link: "a"
      price: ".bukken-card__price"
      address: ".bukken-card__address"

  # ---------------------------------------------------- 不動産連合隊(福岡対応)
  - name: 不動産連合隊 福岡
    type: generic
    enabled: false            # 要調整
    url: "(連合隊の検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: p }
    selectors:                # 要調整
      item: ".article_estate"
      title: ".estate_name"
      link: "a"
      price: ".price"
      address: ".address"

  # ---------------------------------------------------- 対象外(福岡非対応のため未収録)
  # 恵比寿不動産  : 東京都心4区(渋谷・港・目黒・品川)専門のため福岡の物件はありません
  # 長谷工の仲介  : 首都圏専門のため福岡の物件はありません
  # 福岡でも探したい場合はこの2社は各社サイトの会員登録メールをご利用ください

# ---------------------------------------------------- 共通フィルタ
filters:
  price_min_man: 1500      # 下限価格(万円)
  price_max_man: 3500      # 上限価格(万円)
  area_min_m2: 65          # 面積下限(㎡)※取得できたサイトのみ適用
  layouts:                 # 間取り(部分一致)※取得できたサイトのみ適用
    - 3LDK
    - 4LDK
  exclude_keywords:
    - オーナーチェンジ
  # include_keywords:      # 物件名・住所に必ず含めたい語(例: - 早良区)
  #   - 福岡市
