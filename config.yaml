# ============================================================
# 不動産新着通知 設定ファイル(マルチサイト対応)
# ============================================================
#
# 各サイトの使い方:
#  1. そのサイトで希望条件(福岡・価格帯など)を指定して検索
#  2. 検索結果ページのURLを url: に貼り付け
#  3. type: generic のサイトは selectors を実ページに合わせて調整
#     (ブラウザで右クリック→「検証」でCSSクラス名を確認)
#  4. 調整できたら enabled: true に変更
#  5. 動作確認: python main.py --test "ソース名"
#
# ※ selectorsはサイト側の改修で変わるため「要調整」の目印付きの
#   ものは必ず --test で確認してから有効化してください。

sources:
  # ---------------------------------------------------- SUUMO(専用パーサー・動作優先度高)
  - name: SUUMO 福岡市早良区 中古マンション
    type: suumo
    enabled: true
    url: "https://suumo.jp/jj/bukken/ichiran/JJ012FC001/?ar=090&bs=011&ta=40&sc=40137&po=0&pj=1&pc=100"
    max_pages: 3

  - name: SUUMO 福岡市城南区 中古マンション
    type: suumo
    enabled: true
    url: "https://suumo.jp/jj/bukken/ichiran/JJ012FC001/?ar=090&bs=011&ta=40&sc=40136&po=0&pj=1&pc=100"
    max_pages: 3

  # SUUMOの土地・戸建も同じtype: suumoでURLを変えるだけで動きます
  # - name: SUUMO 福岡市早良区 土地
  #   type: suumo
  #   enabled: false
  #   url: "(SUUMOで土地検索した結果URL)"

  # ---------------------------------------------------- ふれんず(福岡県宅建協会・専用パーサー)
  # 検索結果はJavaScriptで読み込まれるため専用パーサー(type: freins)を使用。
  # URLはブラウザの検索結果に出る items?... のURLをそのまま貼ればOK。
  # _token は毎回自動取得し直すので、貼ったURLのトークンが古くても問題ありません。
  - name: ふれんず 福岡市中央・南・城南 中古マンション
    type: freins
    enabled: true
    url: "https://www.f-takken.com/freins/buy/mansion/area/items?listtype=mansion&lang=ja&limit=20&order1=pl&order2=&location=area&_token=opE6HxoE6ZRuEdQGiEmUbRoUksM8XdhLcNlSkw0I&locate%5B%5D=40133&locate%5B%5D=40135&locate%5B%5D=40136&data_21=0&data_22=3500&data_171=1&data_172=1&data_173=1&data_174=1&data_175=1&data_176=1&data_177=1&data_30=60&data_31=0&data_29=7&data_32=0&data_486=&data_486_code=&data_487=&data_487_code="

  # ---------------------------------------------------- athome(※ボット対策が強く取得失敗しやすい)
  - name: athome 福岡 中古マンション
    type: generic
    enabled: false            # 要調整: athomeはアクセス遮断されやすい。失敗時はサイトの新着メール機能を推奨
    url: "https://www.athome.co.jp/mansion/chuko/theme/shinchaku/fukuoka/fukuoka-locate/list/?pref=40&cities=fukuoka_nishi,fukuoka_jonan,fukuoka_sawara&basic=kp005,kp106,kk002,kk003,km010,km015,km021,kt424,kt110,ke001,kn001&kod=&q=1&sort=95&limit=30"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".p-property-unit"
      title: ".p-property-unit__title"
      link: "a"
      price: ".p-property-unit__price"
      address: ".p-property-unit__address"
      layout: ".p-property-unit__layout"
      area: ".p-property-unit__area"

  # ---------------------------------------------------- LIFULL HOME'S(※ボット対策強め)
  - name: HOMES 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "https://www.homes.co.jp/mansion/chuko/fukuoka/list/"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".mod-mergeBuilding--sale"
      title: ".heading a"
      link: ".heading a"
      price: ".price"
      address: ".bukkenSpec"
      layout: ".layout"
      area: ".space"

  # ---------------------------------------------------- HOME4U
  - name: HOME4U 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "https://www.home4u.jp/buy/search/list/municipality/4/40/135,136,137/pl=2000&ph=3500&bl=60&m=14,6,7,15,8,9,17,10,16,11"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".property-list__item"
      title: ".property-list__title"
      link: "a"
      price: ".property-list__price"
      address: ".property-list__address"

  # ---------------------------------------------------- 東急リバブル
  - name: 東急リバブル 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "https://www.livable.co.jp/kounyu/chuko-mansion/fukuokaken/a40137,a40136,a40135/conditions-price-from=2500&price-to=3500&layout=3k-3dk-3ldk,4k-4dk-4ldk,5k&size=60/"
    max_pages: 2
    pagination: { param: pg }
    selectors:                # 要調整
      item: ".o-product-list__item"
      title: ".o-product-list__name"
      link: "a"
      price: ".o-product-list__price"
      address: ".o-product-list__address"

  # ---------------------------------------------------- 楽待(収益・投資)
  - name: 楽待 福岡 収益物件
    type: generic
    enabled: false            # 要調整: 会員向けページが多く未ログインでは一部のみ
    url: "https://www.rakumachi.jp/syuuekibukken/area/prefecture/dimAll/?realtor_id=&area%5B%5D=40135&area%5B%5D=40136&area%5B%5D=40137&line=&st=&limit=50&keyword=&newly=&price_from=2500&price_to=3000&gross_from=&gross_to=&dim%5B%5D=2001&year_from=&year_to=&b_area_from=60&b_area_to=&houses_ge=&houses_le=&min=&l_area_from=&l_area_to="
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".property-card"
      title: ".property-card__title"
      link: "a"
      price: ".property-card__price"
      address: ".property-card__address"

  # ---------------------------------------------------- 健美家(収益・投資)
  - name: 健美家 福岡 収益物件
    type: generic
    enabled: false            # 要調整
    url: "(健美家の検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".property_box"
      title: ".property_title"
      link: "a"
      price: ".price"
      address: ".address"

  # ---------------------------------------------------- 三井のリハウス
  - name: 三井のリハウス 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "https://www.rehouse.co.jp/buy/mansion/prefecture/40/city/40135/?cityCode=40136,40137&minPrice=2500&maxPrice=3500&minExclusiveArea=60&floorPlan=0323456789,0423456789,H0523456789"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".p-result-item"
      title: ".p-result-item__name"
      link: "a"
      price: ".p-result-item__price"
      address: ".p-result-item__address"

  # ---------------------------------------------------- 住友不動産販売(ステップ)
  - name: 住友ステップ 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "(住友不動産販売の検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".bukken-item"
      title: ".bukken-name"
      link: "a"
      price: ".bukken-price"
      address: ".bukken-address"

  # ---------------------------------------------------- 大京穴吹不動産
  - name: 大京穴吹 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "(大京穴吹の検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".property-item"
      title: ".property-name"
      link: "a"
      price: ".property-price"
      address: ".property-address"

  # ---------------------------------------------------- ピタットハウス
  - name: ピタットハウス 福岡 売買
    type: generic
    enabled: false            # 要調整
    url: "(ピタットハウスの検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".bukken_list_item"
      title: ".bukken_name"
      link: "a"
      price: ".price"
      address: ".address"

  # ---------------------------------------------------- ノムコム(野村)
  - name: ノムコム 福岡 中古マンション
    type: generic
    enabled: false            # 要調整
    url: "(ノムコムの検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".p-searchList__item"
      title: ".p-searchList__name"
      link: "a"
      price: ".p-searchList__price"
