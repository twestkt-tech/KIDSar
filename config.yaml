  # ---------------------------------------------------- センチュリー21
  - name: センチュリー21 福岡 売買
    type: generic
    enabled: false            # 要調整
    url: "(センチュリー21の検索結果URLを貼る)"
    max_pages: 2
    pagination: { param: page }
    selectors:                # 要調整
      item: ".property-card"
      title: ".property-card__title"
      link: "a"
      price: ".property-card__price"
      address: ".property-card__address"

  # ---------------------------------------------------- 大和ハウス(リブネス等)
  - name: 大和ハウス 福岡 中古・土地
    type: generic
    enabled: false            # 要調整
    url: "(大和ハウスの検索結果URLを貼る)"
    max_pages: 2
